<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUA-PREDICT | Monitoreo y Analítica</title>

  <!-- RECURSOS EXTERNOS (CDNs) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- ENCABEZADO PRINCIPAL -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      
      <!-- Identidad visual y nombre del proyecto -->
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-droplet text-blue-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">
          AQUA-PREDICT 
          <span class="text-xs text-blue-400 font-normal ml-2">Mixco, GT</span>
        </h1>
      </div>

      <!-- Panel de Control Derecho -->
      <div class="flex items-center space-x-4">
        <span id="status-badge" class="px-3 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sistema Normal
        </span>

        <button 
          id="logout-btn" 
          class="bg-slate-700 hover:bg-red-600/80 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 border border-slate-600 hover:border-red-500"
          title="Cerrar sesión actual"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline">Cerrar Sesión</span>
        </button>
      </div>

    </div>
  </header>

  <!-- PANEL PRINCIPAL (DASHBOARD) -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- SECCIÓN 1: TARJETAS DE MÉTRICAS RÁPIDAS (KPIs) -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Nivel Actual -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Nivel Actual</p>
          <h3 id="metric-percentage" class="text-3xl font-bold text-white mt-1">-- %</h3>
        </div>
        <div class="p-3 bg-blue-500/10 rounded-lg text-blue-400">
          <i class="fa-solid fa-water text-xl"></i>
        </div>
      </div>

      <!-- Volumen Estimado -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Volumen Estimado</p>
          <h3 id="metric-volume" class="text-3xl font-bold text-white mt-1">-- L</h3>
        </div>
        <div class="p-3 bg-cyan-500/10 rounded-lg text-cyan-400">
          <i class="fa-solid fa-flask text-xl"></i>
        </div>
      </div>

      <!-- Reserva Estimada (TRR) -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Reserva Estimada (TRR)</p>
          <h3 id="metric-trr" class="text-3xl font-bold text-amber-400 mt-1">-- hrs</h3>
        </div>
        <div class="p-3 bg-amber-500/10 rounded-lg text-amber-400">
          <i class="fa-solid fa-clock text-xl"></i>
        </div>
      </div>

      <!-- Distancia Sensor -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Distancia Sensor</p>
          <h3 id="metric-distance" class="text-3xl font-bold text-white mt-1">-- cm</h3>
        </div>
        <div class="p-3 bg-indigo-500/10 rounded-lg text-indigo-400">
          <i class="fa-solid fa-ruler-vertical text-xl"></i>
        </div>
      </div>

    </div>

    <!-- SECCIÓN 2: VISUALIZACIÓN GRÁFICA Y TANQUE DINÁMICO CON LEDS -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Componente Visual A: Tanque Animado e Indicadores LED Virtuales -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 flex flex-col items-center justify-center">
        <h2 class="text-lg font-semibold text-slate-200 mb-4 w-full text-left">Estado del Tanque</h2>
        
        <div class="flex gap-6 items-center">
          <!-- Marco exterior del tanque -->
          <div class="relative w-40 h-72 border-4 border-slate-600 rounded-2xl overflow-hidden bg-slate-900/50 flex flex-col justify-end">
            <!-- Escala porcentual -->
            <div class="absolute inset-y-0 right-2 flex flex-col justify-between py-2 text-[10px] text-slate-500 font-mono z-10">
              <span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span>
            </div>
            
            <!-- Nivel del agua dinámico -->
            <div id="tank-water" class="w-full bg-gradient-to-t from-blue-700 to-blue-500 transition-all duration-700 ease-out flex items-center justify-center" style="height: 0%;">
              <span id="tank-text" class="text-xs font-bold text-white drop-shadow">0%</span>
            </div>
          </div>

          <!-- SEMÁFORO DE LEDS EN EL DASHBOARD -->
          <div class="flex flex-col gap-5 bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider text-center">Alertas</span>
            
            <!-- LED Verde (Alto / Normal) -->
            <div class="flex items-center gap-3">
              <span id="led-green" class="w-5 h-5 rounded-full bg-slate-700 border border-slate-600 transition-all duration-300"></span>
              <span class="text-xs text-slate-300 font-medium">Alto (>50%)</span>
            </div>
            <!-- LED Amarillo (Medio / Advertencia) -->
            <div class="flex items-center gap-3">
              <span id="led-yellow" class="w-5 h-5 rounded-full bg-slate-700 border border-slate-600 transition-all duration-300"></span>
              <span class="text-xs text-slate-300 font-medium">Medio (20-50%)</span>
            </div>
            <!-- LED Rojo (Bajo / Crítico) -->
            <div class="flex items-center gap-3">
              <span id="led-red" class="w-5 h-5 rounded-full bg-slate-700 border border-slate-600 transition-all duration-300"></span>
              <span class="text-xs text-slate-300 font-medium">Crítico (<20%)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Componente Visual B: Lienzo para el gráfico -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 lg:col-span-2">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">Proyección y Consumo de Agua</h2>
        <div class="h-64">
          <canvas id="consumptionChart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
